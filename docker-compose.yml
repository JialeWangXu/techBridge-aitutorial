services:
  techbridge-user:
    build: .
    image: techbridge-aitutorial:latest
    restart: always
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ai_tutorial_db
      EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE: http://host.docker.internal:8761/eureka/
    networks:
      - techBridge
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  techBridge:
    driver: bridge
